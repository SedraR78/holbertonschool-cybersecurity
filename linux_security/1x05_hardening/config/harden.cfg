# config/harden.cfg - data only, no logic

# --- SSH ---
SSH_PORT="22"
ALLOWED_SSH_USERS="student"
SSH_PERMIT_ROOT="no"
SSH_PASSWORD_AUTH="no"
SSH_MAX_AUTH_TRIES="3"

# --- Firewall ---
FIREWALL_DEFAULT_INCOMING="deny"
FIREWALL_DEFAULT_OUTGOING="allow"
ALLOWED_PORTS=("22/tcp" "80/tcp" "443/tcp")

# --- Password policy ---
PASS_MIN_LEN="14"
PASS_MIN_CLASS="4"
PASS_MAX_DAYS="90"
PASS_MIN_DAYS="7"
PASS_WARN_AGE="14"
FAILLOCK_DENY="5"
FAILLOCK_UNLOCK_TIME="900"

# --- Services to disable ---
DISABLE_SERVICES=("avahi-daemon" "cups" "rpcbind")

# --- Paths ---
REPORT_FILE="/var/log/hardening_report.txt"
BACKUP_DIR="/var/backups/hardening"
