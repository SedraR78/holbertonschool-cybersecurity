# STIG-2024 configuration values

# SSH
SSH_PORT="22"
SSH_PERMIT_ROOT="no"
SSH_PASSWORD_AUTH="no"
SSH_PUBKEY_AUTH="yes"
SSHD_CONFIG="/etc/ssh/sshd_config"

# Firewall
FIREWALL_DIR="/etc/hardening"
FIREWALL_FILE="/etc/hardening/firewall.rules"
DEFAULT_INPUT="deny"
DEFAULT_OUTPUT="allow"
ALLOW_HTTP="80"
ALLOW_HTTPS="443"

# Kernel
SYSCTL_CONF="/etc/sysctl.conf"
IP_FORWARD="0"
ICMP_IGNORE="1"

# Password policy
PASS_MIN_LEN="12"
PASS_MAX_DAYS="90"
PASS_MIN_DAYS="7"
PASS_WARN_AGE="14"
FAIL_LOCK_ATTEMPTS="5"
FAIL_LOCK_TIME="900"
PAM_PASSWORD="/etc/pam.d/common-password"
PAM_AUTH="/etc/pam.d/common-auth"
LOGIN_DEFS="/etc/login.defs"

# Account cleanup
UID_MIN="1000"
PROTECTED_GROUPS=("sudo" "wheel")

# Packages
PKG_REMOVE=("telnet" "ftp" "netcat-traditional")
PKG_INSTALL=("auditd" "fail2ban")

# Output
REPORT_FILE="audit_report.txt"
BACKUP_DIR="/var/backups/hardening"
