# Services to monitor
SERVICES=("ssh" "cron")

# Critical files to check integrity
FILES_TO_WATCH=("/etc/passwd" "/etc/ssh/sshd_config")

# Ports allowed to listen
ALLOWED_PORTS=("22" "80")

# Golden copies location
GOLDEN_DIR="/var/backups/sentinel"

# Structured log output
LOG_FILE="/var/log/sentinel.log"
